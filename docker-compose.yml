# Postgres local para desenvolvimento. Produção roda no Railway.
services:
  postgres:
    image: postgres:16-alpine
    container_name: catalogo-presentes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
      POSTGRES_DB: catalogo_presentes
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catalogo -d catalogo_presentes']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
