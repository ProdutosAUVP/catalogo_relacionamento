# Publica a vitrine estática (pasta demo/) no GitHub Pages.
#
# A vitrine é uma demonstração navegável com dados fictícios, feita para quem
# aprova o V1. A aplicação real NÃO roda aqui: ela depende de Postgres, sessão
# do SSO e geração de arquivos no servidor, e é publicada no Railway.

name: Vitrine (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O CSS é compilado aqui: a página publicada não depende de CDN.
      - run: npm run demo:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
